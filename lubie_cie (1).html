<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lubię Cię ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#8b5cf6);
  color:white;text-align:center;
}
.photo{
  width:190px;height:190px;object-fit:cover;object-position:center 25%;
  border-radius:50%;border:5px solid rgba(255,255,255,.9);
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}
.card{
  width:min(90%,560px);padding:45px 28px;border-radius:30px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(14px);
  box-shadow:0 20px 70px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.25);z-index:2;
}
h1{font-size:clamp(42px,10vw,78px);margin:0 0 10px}
p{font-size:20px;line-height:1.45}
.small{opacity:.85;font-size:15px}
.buttons{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:25px;min-height:70px}
button{
  border:0;border-radius:999px;padding:15px 24px;font-size:17px;
  font-weight:800;cursor:pointer;transition:.2s;
}
#yes{background:white;color:#e83e70}
#yes:hover{transform:scale(1.08)}
#no{background:#27272a;color:white;position:relative}
#result{font-size:24px;font-weight:800;min-height:38px;margin-top:18px}
.heart{
  position:fixed;bottom:-50px;pointer-events:none;
  animation:float linear forwards;opacity:.8
}
@keyframes float{
  to{transform:translateY(-115vh) rotate(540deg);opacity:0}
}
.boom{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.13)}}
</style>

  <div style="font-size:38px;margin-top:12px">👀❤️</div>
  <h1>Lubię Cię</h1>
  <p>I to jest oficjalny komunikat.<br>
  Źródła są wiarygodne. Badania trwały długo.<br>
  Wynik: <b>zdecydowanie za bardzo 😏</b></p>
  <div class="small">Czy Ty też mnie lubisz?</div>

  <div class="buttons">
    <button id="yes">TAK ❤️</button>
    <button id="no">Nie 😐</button>
  </div>
  <div id="result"></div>
</div>

<script>
const no=document.getElementById('no');
const yes=document.getElementById('yes');
const result=document.getElementById('result');
const card=document.getElementById('card');

function escape(){
  const x=(Math.random()*240)-120;
  const y=(Math.random()*150)-75;
  no.style.transform=`translate(${x}px,${y}px)`;
  no.textContent=["Na pewno? 🤨","Przemyśl to","Ej no 😭","Nie klikniesz 😎","Spróbuj jeszcze raz"][Math.floor(Math.random()*5)];
}
no.addEventListener('mouseenter',escape);
no.addEventListener('touchstart',e=>{e.preventDefault();escape()});
no.addEventListener('click',escape);

yes.addEventListener('click',()=>{
  result.innerHTML="Wiedziałem 😎❤️<br><span style='font-size:16px'>No to teraz już nie ma odwrotu.</span>";
  card.classList.remove('boom'); void card.offsetWidth; card.classList.add('boom');
  for(let i=0;i<35;i++) setTimeout(makeHeart,i*45);
});

function makeHeart(){
  const h=document.createElement('div');
  h.className='heart';
  h.textContent=['❤️','💗','💕','💖'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(18+Math.random()*35)+'px';
  h.style.animationDuration=(3+Math.random()*4)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7500);
}
setInterval(makeHeart,900);
</script>
</body>
</html>
